name: CI

on:
  push:
    branches: [trial2, main]
  pull_request:
    branches: [trial2, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # `Lonch game/launch-lab` lives in a private repository, so a CI run with
      # no token cannot clone it. Check out this repository first and try the
      # submodule separately, so its absence cannot fail the whole job.
      - uses: actions/checkout@v4

      - name: Optional launch-lab submodule
        continue-on-error: true
        run: git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:app
      - name: Simulation tests (require the launch-lab submodule)
        if: hashFiles('Lonch game/launch-lab/test/sim.test.mjs') != ''
        run: npm run test:sim
      - run: npm run build
